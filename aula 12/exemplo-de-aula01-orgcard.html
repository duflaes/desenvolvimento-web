<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>organizando os cards</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light">
    <main class="container py-5">
        <h1 class="text-center mb-5 fw-bold text-uppercase tracking-wide">Aprendendo Front-End</h1>
        <div class="row g-4 justify-content-center">
            
        
            <div class="col-12 col-md-6">
                <article class="card h-100 bg-secondary bg-opacity-10 border-light border-opacity-25 shadow-lg text-light rounded-4">
                    <div class="card-body p-4">
                        <h2 class="card-title h4 fw-bold text-info mb-3">HTML</h2>
                        <p class="card-text text-light opacity-75 mb-4">
                            O HTML organiza o conteúdo estrutural das páginas web com tags semânticas.
                        </p>
                        <a href="https://www.w3schools.com/html" class="btn btn-primary px-4 py-2 rounded-pill shadow-sm">
                            Conhecer o HTML
                        </a>
                    </div>
                </article>
            </div>

            <div class="col-12 col-md-6">
                <article class="card h-100 bg-secondary bg-opacity-10 border-light border-opacity-25 shadow-lg text-light rounded-4">
                    <div class="card-body p-4">
                        <h2 class="card-title h4 fw-bold text-info mb-3">CSS</h2>
                        <p class="card-text text-light opacity-75 mb-4">
                            O CSS define o estilo visual, cores, layouts e responsividade das páginas.
                        </p>
                        <a href="https://www.w3schools.com/css/" class="btn btn-primary px-4 py-2 rounded-pill shadow-sm">
                            Conhecer o CSS
                        </a>
                    </div>
                </article>
            </div>

        </div>
    </main>
</body>
</html>
