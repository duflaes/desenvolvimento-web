<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tabela</title>
</head>
<body>
    <h1>
      Exemplo de Tabela                              
    </h1>
    <p>
        As tabelas em HTML são usadas para <br>
        organizar dados em linhas e colunas.
    </p>

     <table border="1">
         <thead>
             <tr>
                  <th>duda</th>
                  <th>18</th>
                  <th>guarulhos</th>
              </tr> 
           <thead>
           <tbody>
               <tr>
                   <td>ana</td>
                   <td>25</td>
                   <td>sao paulo</td>
               </tr>
               <tr>
                  <td>carla</td>
                  <td>28</td>
                  <td>curitiba</td>
               </tr>
           </tbody>
       </table>
    <tbody>
  </table
</body>
</html>
