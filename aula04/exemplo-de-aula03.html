<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo div com css</title>

    <style>
        div{
            font-size: 28px;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }
        #principal{
            background-color:rgb(205, 169, 240);
            border: 2px solid rgb(110, 110, 218);
            color: rgb(226, 167, 167);
        }
        
        #secundaria{
            background-color:rgb(61, 19, 102);
            border: 2px solid rgb(204, 58, 131);
            color: rgb(39, 177, 135);
        }
        hr{
            border: none;
            border-top: 3px solid yellowgreen;
            width: 80%
        }
        
    </style>

</head>
<body>
    <div id="principal">
          esta e a primeira linha.
          <br>
          esta e a segunda linha.
    </div>
    <hr/>
    <div id="secundaria">
        esta e outra divisao da pagina
        <br>
        aqui começa uma nova linha.
        </div>
</body>
</html
